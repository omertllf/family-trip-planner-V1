function safeNum(v){var n=parseFloat(v);return isNaN(n)?0:n;}
function fmt$(v){return v?"$"+safeNum(v).toLocaleString("en-US",{minimumFractionDigits:0,maximumFractionDigits:0}):"-";}
function nights(a,b){if(!a||!b)return 0;var d=(new Date(b)-new Date(a))/86400000;return d>0?d:0;}
function fmtD(v){if(!v||v==="-")return"-";var p=v.split("-");return p.length===3?p[2]+"-"+p[1]+"-"+p[0]:v;}
function cityOf(addr){if(!addr)return"";var p=addr.split(",").map(function(s){return s.trim();}).filter(Boolean);return p.length>=2?p[p.length-2]:p[0]||"";}
function typeIcon(t){return t==="accommodation"?"🏠":t==="flight"?"✈️":t==="car"?"🚗":"🎯";}
function typeLabel(t){return t==="accommodation"?"Stay":t==="flight"?"Flight":t==="car"?"Car":"Activity";}
function matchesSearch(e,q){

}
function validate(item){

  return errors;
}

function storeGet(k){

async function storeGetCloud(k){
  try{
    if(typeof db==="undefined"||!auth.currentUser)return null;
    var uid=auth.currentUser.uid;
    var doc=await db.collection("users").doc(uid).collection("data").doc(k).get();
    if(doc.exists){var d=doc.data();return d.value?JSON.parse(d.value):null;}
    return null;
  }catch(e){console.warn("Firestore read failed:",e);return null;}
}

function parseICS(text){
  var evts=[];
  text.split("BEGIN:VEVENT").slice(1).forEach(function(block){
    var unfolded=block.replace(/\r?\n[ \t]/g,"");
    function g(k){var m=unfolded.match(new RegExp(k+"(?:;[^:]*)?:(.+)"));return m?m[1].trim():"";}
    function pd(s){if(!s)return"";s=s.replace(/T.*/,"");return s.slice(0,4)+"-"+s.slice(4,6)+"-"+s.slice(6,8);}
    function pt(s){if(!s||s.indexOf("T")<0)return"";var t=s.slice(9,13);return t.slice(0,2)+":"+t.slice(2,4);}
    var ds=g("DTSTART"),de=g("DTEND");
    evts.push({summary:g("SUMMARY"),description:g("DESCRIPTION"),location:g("LOCATION"),startDate:pd(ds),endDate:pd(de),startTime:pt(ds),endTime:pt(de)});
  });
  return evts;
}
function icsToEntry(ev,type){
  var b={id:Date.now()+Math.random(),type:type};
  if(type==="accommodation")return Object.assign(newAcc(),b,{name:ev.summary,checkIn:ev.startDate,checkOut:ev.endDate,address:ev.location,notes:ev.description});
  if(type==="flight")return Object.assign(newFlt(),b,{airline:ev.summary,depDate:ev.startDate,depTime:ev.startTime,arrDate:ev.endDate,arrTime:ev.endTime,from:ev.location,notes:ev.description});
  if(type==="car")return Object.assign(newCar(),b,{company:ev.summary,pickupDate:ev.startDate,dropoffDate:ev.endDate,pickupLocation:ev.location,notes:ev.description});
  return Object.assign(newAct(),b,{name:ev.summary,date:ev.startDate,location:ev.location,notes:ev.description});
}
function toB64(f){return new Promise(function(res,rej){var r=new FileReader();r.onload=function(){res(r.result.split(",")[1]);};r.onerror=rej;r.readAsDataURL(f);});}
function toText(f){return new Promise(function(res,rej){var r=new FileReader();r.onload=function(){res(r.result);};r.onerror=rej;r.readAsText(f);});}

function claudeExtract(messages){
  var sys="You are a travel booking data extractor. Return ONLY valid JSON, no markdown.\nDetect type: accommodation, flight, car, activity.\nShapes (YYYY-MM-DD dates):\naccommodation:{type,name,platform,checkIn,checkOut,address,contact,url,confirmation,totalCost,costPerNight,parking,kitchen,breakfast,notes}\nflight:{type,airline,flightNo,from,to,depDate,depTime,arrDate,arrTime,cost,bookingRef,url,notes}\ncar:{type,company,carType,pickupLocation,dropoffLocation,pickupDate,dropoffDate,cost,confirmation,url,notes}\nactivity:{type,name,category,date,duration,location,cost,url,notes}";
  return fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:1000,system:sys,messages:messages})})
    .then(function(r){return r.json();})
    .then(function(d){if(d.error)throw new Error(d.error.message||"API error");return d.content.map(function(c){return c.text||"";}).join("");});
}

function buildPrintHTML(tab,acc,flt,car,act,tripName){
  var allE=acc.concat(flt,car,act);
  var entries=tab==="accommodations"?acc:tab==="flights"?flt:tab==="cars"?car:tab==="activities"?act:allE;
  var aCC=acc.reduce(function(s,e){return s+safeNum(e.totalCost);},0);
  var fCC=flt.reduce(function(s,e){return s+safeNum(e.cost);},0);
  var cCC=car.reduce(function(s,e){return s+safeNum(e.cost);},0);
  var acC=act.reduce(function(s,e){return s+safeNum(e.cost);},0);
  var tot=aCC+fCC+cCC+acC;
  var css="body{font-family:Arial,sans-serif;font-size:11px;color:#111;margin:20px}h1{font-size:16px;margin-bottom:4px}.sub{color:#555;font-size:11px;margin-bottom:14px}table{width:100%;border-collapse:collapse;margin-bottom:20px}th{background:#f0f0f0;padding:6px 8px;text-align:left;border:1px solid #ccc}td{padding:5px 8px;border:1px solid #ddd;vertical-align:top}tr:nth-child(even){background:#fafafa}.badge{display:inline-block;padding:2px 6px;border-radius:3px;font-size:10px;font-weight:bold;color:#fff}.acc{background:#6366f1}.flt{background:#0ea5e9}.car{background:#f59e0b}.act{background:#10b981}.totals{display:flex;gap:16px;margin-bottom:14px;flex-wrap:wrap}.tot-box{border:1px solid #ddd;border-radius:6px;padding:8px 12px;min-width:100px}.tot-label{font-size:10px;color:#666}.tot-val{font-size:14px;font-weight:bold}";
  var tots="<div class='totals'><div class='tot-box'><div class='tot-label'>Stays</div><div class='tot-val'>"+fmt$(aCC)+"</div></div><div class='tot-box'><div class='tot-label'>Flights</div><div class='tot-val'>"+fmt$(fCC)+"</div></div><div class='tot-box'><div class='tot-label'>Cars</div><div class='tot-val'>"+fmt$(cCC)+"</div></div><div class='tot-box'><div class='tot-label'>Activities</div><div class='tot-val'>"+fmt$(acC)+"</div></div><div class='tot-box'><div class='tot-label'>Total</div><div class='tot-val'>"+fmt$(tot)+"</div></div></div>";
  var rows=entries.slice().sort(function(a,b){var sa=a.checkIn||a.depDate||a.pickupDate||a.date||"",sb=b.checkIn||b.depDate||b.pickupDate||b.date||"";return sa.localeCompare(sb);});
  var trs=rows.map(function(e){
    var name=e.name||e.airline||e.company||"";
    var start=fmtD(e.checkIn||e.depDate||e.pickupDate||e.date||"");
    var end=fmtD(e.checkOut||e.arrDate||e.dropoffDate||"");
    var nts=e.type==="accommodation"?nights(e.checkIn,e.checkOut):"";
    var cost=e.type==="accommodation"?fmt$(e.totalCost):fmt$(e.cost);
    var loc=e.address||e.from||e.pickupLocation||e.location||"";
    var cls=e.type==="accommodation"?"acc":e.type==="flight"?"flt":e.type==="car"?"car":"act";
    return "<tr><td><span class='badge "+cls+"'>"+typeLabel(e.type)+"</span></td><td>"+name+"</td><td>"+start+"</td><td>"+end+"</td><td>"+(nts||"-")+"</td><td>"+cost+"</td><td>"+loc+"</td><td>"+(e.notes||"")+"</td></tr>";
  }).join("");
  var tbl="<table><thead><tr><th>Type</th><th>Name</th><th>Start</th><th>End</th><th>Nights</th><th>Cost</th><th>Location</th><th>Notes</th></tr></thead><tbody>"+trs+"</tbody></table>";
  return "<!DOCTYPE html><html><head><meta charset='utf-8'><title>"+(tripName||"Trip")+"</title><style>"+css+"</style></head><body><h1>"+(tripName||"Family Trip Planner")+"</h1><div class='sub'>Exported "+new Date().toLocaleDateString("en-GB")+"</div>"+tots+tbl+"</body></html>";
}

function GmailBridgeModal(props){
  var onClose=props.onClose,onImportEntries=props.onImportEntries;
  var stepS=useState("pick"); var step=stepS[0],setStep=stepS[1];
  var lblS=useState(KNOWN_LABELS[0]); var selLabel=lblS[0],setSelLabel=lblS[1];
  var pasteS=useState(""); var pasteText=pasteS[0],setPasteText=pasteS[1];
  var errS=useState(""); var parseErr=errS[0],setParseErr=errS[1];
  var prevS=useState(null); var preview=prevS[0],setPreview=prevS[1];
  var selS=useState(new Set()); var selectedIds=selS[0],setSelectedIds=selS[1];


  function handleSend(){
    var prompt='GMAIL_IMPORT_REQUEST label="'+selLabel.name+'" labelId='+selLabel.id+'\n\nScan my Gmail label and extract all travel bookings. Return ONLY:\n\n```gmail_import\n{"entries":[...]}\n```\n\nSchema (YYYY-MM-DD dates):\naccommodation:{type,name,platform,checkIn,checkOut,address,contact,url,confirmation,totalCost,costPerNight,parking,kitchen,breakfast,notes}\nflight:{type,airline,flightNo,from,to,depDate,depTime,arrDate,arrTime,cost,bookingRef,url,notes}\ncar:{type,company,carType,pickupLocation,dropoffLocation,pickupDate,dropoffDate,cost,confirmation,url,notes}\nactivity:{type,name,category,date,duration,location,cost,url,notes}';
    if(typeof sendPrompt==="function"){sendPrompt(prompt);setStep("sent");}
    else{window.open('https://claude.ai/new?q='+encodeURIComponent(prompt),'_blank');setStep("sent");}
  }
  function handleParse(){
    setParseErr("");
    try{
      var text=pasteText.trim(),json;
      var match=text.match(/```gmail_import\s*([\s\S]*?)```/);
      if(match){json=JSON.parse(match[1].trim());}
      else{var rawMatch=text.match(/\{[\s\S]*"entries"[\s\S]*\}/);
        if(rawMatch){json=JSON.parse(rawMatch[0]);}
        else{var arrMatch=text.match(/\[[\s\S]*\]/);
          if(arrMatch){json={entries:JSON.parse(arrMatch[0])};}
          else{throw new Error("Could not find JSON data.");}}}
      if(!json.entries||!Array.isArray(json.entries))throw new Error("Missing entries array.");
      var withIds=json.entries.map(function(e,i){return Object.assign({},e,{id:Date.now()+i+Math.random()});});
      setPreview(withIds);setSelectedIds(new Set(withIds.map(function(e){return e.id;})));setStep("preview");
    }catch(e){setParseErr("Error: "+e.message);}
  }
  function handleImport(){onImportEntries(preview.filter(function(e){return selectedIds.has(e.id);}));onClose();}
  function toggleEntry(id){setSelectedIds(function(prev){var n=new Set(prev);n.has(id)?n.delete(id):n.add(id);return n;});}

  var labelSelect=h("div",{style:{marginBottom:16}},
    h("label",{style:{display:"block",fontSize:12,color:"var(--text2)",marginBottom:6}},"Gmail Label"),
    h("select",{value:selLabel.id,onChange:function(e){var l=KNOWN_LABELS.filter(function(x){return x.id===e.target.value;})[0];if(l)setSelLabel(l);},style:{width:"100%",background:"var(--input-bg)",border:"1px solid var(--border)",borderRadius:6,padding:"9px 10px",color:"var(--text)",fontSize:13,appearance:"auto"}},
      KNOWN_LABELS.map(function(l){return h("option",{key:l.id,value:l.id},l.name);}))
  );

  if(step==="pick") return h(Overlay,{onClose:onClose},
    h(MH,{title:"📧 Import from Gmail",onClose:onClose}),
    labelSelect,
    parseErr&&h("div",{style:{background:"var(--danger-bg)",borderRadius:6,padding:"8px 12px",fontSize:12,color:"var(--danger)",marginBottom:12}},"⚠️ "+parseErr),

    h("div",{style:{background:"var(--surface2)",borderRadius:10,padding:16,border:"1px solid var(--border)"}},
      h("div",{style:{fontSize:14,fontWeight:700,color:"var(--text)",marginBottom:6}},"📋 Gmail Import"),
