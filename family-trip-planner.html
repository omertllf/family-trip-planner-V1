function PieChart(props){
  var data=props.data;
  var total=data.reduce(function(s,d){return s+d.value;},0);
  if(!total)return h("div",{style:{textAlign:"center",padding:40,color:"var(--text3)"}},"No expenses yet");
  var size=200,cx=100,cy=100,r=78;
  // Single-slice special case: SVG arc from point to same point renders nothing
  if(data.filter(function(d){return d.value>0;}).length===1){
    var solo=data.filter(function(d){return d.value>0;})[0];
    return h("svg",{width:size,height:size,viewBox:"0 0 "+size+" "+size,style:{display:"block",margin:"0 auto"}},
      h("circle",{cx:cx,cy:cy,r:r,fill:solo.color})
    );
  }
  var slices=[],cum=-Math.PI/2;
  data.forEach(function(d){
    if(!d.value)return;
    var angle=(d.value/total)*2*Math.PI;
    var x1=cx+r*Math.cos(cum),y1=cy+r*Math.sin(cum);
    cum+=angle;
    var x2=cx+r*Math.cos(cum),y2=cy+r*Math.sin(cum);
    var large=angle>Math.PI?1:0;
    slices.push({path:"M "+cx+" "+cy+" L "+x1.toFixed(2)+" "+y1.toFixed(2)+" A "+r+" "+r+" 0 "+large+" 1 "+x2.toFixed(2)+" "+y2.toFixed(2)+" Z",color:d.color});
  });
  return h("svg",{width:size,height:size,viewBox:"0 0 "+size+" "+size,style:{display:"block",margin:"0 auto"}},
    slices.map(function(s,i){return h("path",{key:i,d:s.path,fill:s.color,stroke:"#fff",strokeWidth:1.5});})
  );
}

}

  useEffect(function(){

    // doesn't prematurely fall through to localStorage fallback.
    setHouseholdLoading(true);

    function resolveHousehold(id,data){
      _householdId=id;
      try{localStorage.setItem("household_id",id);}catch(e){}
      setHouseholdId(id);setHouseholdDoc(data);setHouseholdLoading(false);
    }

    function doCreate(){
      var id="hh_"+Date.now()+"_"+Math.random().toString(36).slice(2,9);
      var displayName=user.displayName||email.split("@")[0];
      var data={name:displayName+"'s Family",ownerEmail:email,allowedEmails:[email],createdAt:Date.now()};
      db.collection("households").doc(id).set(data)
        .then(function(){
          return db.collection("shared").doc("family_data").collection("data").doc("trips_index").get()
            .then(function(oldDoc){
              if(oldDoc.exists)return db.collection("households").doc(id).collection("data").doc("trips_index").set(oldDoc.data());
            }).catch(function(){});
        })
        .then(function(){resolveHousehold(id,data);})
        .catch(function(e){
          console.warn("Household create failed:",e);
          setHouseholdLoading(false);
        });
    }

    function doJoin(joinId){
      db.collection("households").doc(joinId).get().then(function(doc){
        if(!doc.exists){doFindOrCreate();return;}
        var data=doc.data();
        var emails=data.allowedEmails||[];
        if(emails.indexOf(email)>-1){resolveHousehold(joinId,data);window.history.replaceState({},"",window.location.pathname);return;}
        var newEmails=emails.concat([email]);
        db.collection("households").doc(joinId).update({allowedEmails:newEmails})
          .then(function(){
            resolveHousehold(joinId,Object.assign({},data,{allowedEmails:newEmails}));
            window.history.replaceState({},"",window.location.pathname);
          })
          .catch(function(){doFindOrCreate();});
      }).catch(function(){doFindOrCreate();});
    }

    function doFindOrCreate(){
      // Always query all households for this email; pick the oldest (createdAt)
      db.collection("households").where("allowedEmails","array-contains",email).get()
        .then(function(snap){
          if(snap.empty){doCreate();return;}
          var best=null;
          snap.docs.forEach(function(doc){
            var d=doc.data();
            if(!best||(d.createdAt||0)<(best.data.createdAt||Infinity)){best={id:doc.id,data:d};}
          });
          resolveHousehold(best.id,best.data);
        })
        .catch(function(queryErr){
          console.warn("Household email query failed (missing index or network):",queryErr);
          // Email query failed — try reading the cached household doc directly (point-read, no index needed)
          var cachedId=null;
          try{cachedId=localStorage.getItem("household_id");}catch(e){}

            db.collection("households").doc(cachedId).get()

                }
